<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawn of the Zeds</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0b08">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>DAWN <span>of the</span> ZEDS <small>Solitario</small></h1>
    <nav>
      <button id="cancelBtn" class="cancel" hidden>✕ Cancelar acción</button>
      <label class="chk"><input type="checkbox" id="camChk" checked> Cámara guiada</label>
      <button id="soundBtn">Sonido</button>
      <label class="chk"><input type="checkbox" id="fastChk"> Animaciones rápidas</label>
      <button id="rulesBtn">Reglas</button>
      <button id="cardsBtn">Cartas de Héroe</button>
      <button id="undoBtn" disabled>↶ Deshacer</button>
      <button id="newBtn">Nueva partida</button>
    </nav>
  </header>
  <main>
    <aside id="left">
      <section id="actbox"></section>
      <section id="unitbox"></section>
      <section id="handbox"><div class="lbl">Cartas de Destino guardadas</div><div id="hand"></div></section>
    </aside>
    <div id="mapwrap">
      <canvas id="map" width="2000" height="1545"></canvas>
      <div id="banner" hidden></div>
      <div id="toast"></div>
      <div id="tip" hidden></div>
      <div id="zoomctl"><button id="zIn" title="Acercar el mapa">+</button><button id="zOut" title="Alejar el mapa">−</button><button id="zReset" title="Ver el mapa entero">⤢</button></div>
    </div>
    <aside id="side">
      <section id="status"></section>
      <section id="eventbox"><div class="lbl">Carta de Evento en curso</div><img id="evimg" alt="" title="Pulsa para ampliar"></section>
      <section id="logbox"><div id="log"></div></section>
    </aside>
  </main>
</div>
<div id="zoom" hidden></div>
<div id="modal" hidden><div id="modalbox"></div></div>
<script src="js/version.js"></script>
<script src="js/data.js"></script>
<script src="js/events.js"></script>
<script src="js/dest.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
<script src="js/phases.js"></script>
<script src="js/actions.js"></script>
<script src="js/cardtext.js"></script>
<script src="js/sound.js"></script>
<script src="js/voz.js"></script>
<script src="js/ui.js"></script>
<script src="js/ost.js"></script>
<script src="js/anim.js"></script>
<script src="js/expansions.js"></script>
<script src="js/expansions2.js"></script>
<script src="js/sfx.js"></script>
<script src="js/mapzoom.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
<script src="js/bot.js"></script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));</script>
</body>
</html>
