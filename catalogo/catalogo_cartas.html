"texto":"Roba una carta de Destino inmediatamente y coloca la unidad de la Guardia Nacional en el Inicial de la Ruta Destinada. Si indica el Túnel, pasa a ser a elección de los jugadores. La Guardia mueve 1 espacio cada fase 4R y 1 por Acción de Mover. Necesita 2 de Munición por ataque. Tras colocarla, se acaba este turno (roba la siguiente carta).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds","turno especial: coloca la Guardia Nacional y termina el turno"],"img":"assets/cartas/e_guardia.jpg"},{"tipo":"Evento","id":"hace_falta","nombre":"Hace falta un Pueblo…","color":"Naranja (Nivel IV)","acto":2,"especial":false,"expansion":0,"fase":"4","faseNombre":"Fase 4R","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"Túnel → Montaña","Acciones":2},"texto":"Al inicio: 1. Sustituye una unidad de Aldeanos, Refugiados o Civiles en cualquier ruta por una nueva unidad Zed Normal. 2. Coloca la unidad reemplazada en el Hospital por su cara de Fuerza reducida con una ficha de ECG.","codigo":["phases.js › eventEffect: al inicio de la fase 4R"],"img":"assets/cartas/e_hace_falta.jpg"},{"tipo":"Evento","id":"helicoptero","nombre":"Ataque del helicóptero de la Guardia Nacional","color":"Verde (Nivel II)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":0,"Zeds":"Afueras → Autovía","Acciones":3},"texto":"Al inicio: elige una unidad u Horda Zed en un espacio no Inicial de la superficie y tira 2 dados: 2-5 → 1 Impacto; 6-9 → 2 Impactos; 10-12 → 3 Impactos. Aplícalos a la unidad u Horda elegida.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_helicoptero.jpg"},{"tipo":"Evento","id":"heroe_b","nombre":"Llega un Héroe","color":"Azul (Juego Básico y Nivel I)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":0,"Zeds":"Autovía → Afueras → Bosque","Acciones":2},"texto":"Al inicio: coge un nuevo Héroe disponible al azar y colócalo en el Centro de la Ciudad o en cualquier espacio Inicial.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_heroe_b.jpg"},{"tipo":"Evento","id":"heroe_g","nombre":"Llega un Héroe","color":"Verde (Nivel II)","acto":2,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Bosque → Afueras → Autovía","Acciones":2},"texto":"Al inicio: coge un nuevo Héroe disponible al azar y colócalo en el Centro de la Ciudad o en cualquier espacio Inicial.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_heroe_g.jpg"},{"tipo":"Evento","id":"hinchados","nombre":"Los Zeds hinchados estallan","color":"Rojo (Nivel V)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Afueras → Autovía → Montaña","Acciones":2},"texto":"Al inicio, roba Destino: 1. Elimina la unidad Zed (incluyendo Súper Zeds o Propagadores) más cercana al Centro en la Ruta Destinada. 2. Realiza un ataque independiente con Arma de Fuego de Fuerza 4 contra cada unidad adyacente de jugador o Zed. 3. Todas las unidades, incluyendo Refugiados, son afectadas por este ataque. Las unidades en espacios Iniciales no se ven afectadas.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_hinchados.jpg"},{"tipo":"Evento","id":"inteligentes","nombre":"Zeds Inteligentes","color":"Amarillo (Nivel III)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Afueras → Afueras","Acciones":3},"texto":"Al final de esta fase: 1. Coloca un nuevo Zed en el Inicial de las Afueras. 2. Pon la ficha de Inteligentes en el Zed Normal más fuerte: obtiene 1 columna en contra cuando ataca hasta que sea eliminado.","codigo":["phases.js › eventEnd: al final de la fase de Acciones"],"img":"assets/cartas/e_inteligentes.jpg"},{"tipo":"Evento","id":"irrupcion","nombre":"Una irrupción desde las profundidades","color":"Rojo (Nivel V)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Túnel → Túnel","Acciones":3},"texto":"¡Los Zeds emergen tropezando desde el Túnel hacia Farmingdale! Al final de esta fase, todas las unidades Zed en los espacios del Túnel n.º 7, 6, 4, 3 y 5 intentan moverse a la superficie (Universidad, Central Nuclear, Mina, Granja; tirada de Cripta primero). Si no hay sitio, se quedan.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds","phases.js › eventAfterZeds: al final de la fase de los Zeds","alcantarilla (Túnel)"],"img":"assets/cartas/e_irrupcion.jpg"},{"tipo":"Evento","id":"jornada","nombre":"Trabajando una jornada doble","color":"Amarillo (Nivel III)","acto":2,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"Montaña → Autovía","Acciones":3},"texto":"Durante esta fase puedes aumentar la Infección (hasta 3 veces). Cada vez que lo hagas puedes: a) obtener una Acción de Curar gratis o bien b) realizar una Acción de Investigar gratis.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_jornada.jpg"},{"tipo":"Evento","id":"keepcalm","nombre":"«Keep calm» y mata Zeds","color":"Azul (Juego Básico y Nivel I)","acto":4,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":0,"Zeds":"Montaña → Autovía","Acciones":2},"texto":"Al inicio: elige un Héroe en juego; obtiene 2 columnas a favor al atacar Cuerpo a Cuerpo únicamente este turno (solo si es el atacante).","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_keepcalm.jpg"},{"tipo":"Evento","id":"marines","nombre":"El equipo de Marines despliega sus tropas","color":"Verde (Nivel II)","acto":2,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"Montaña → Autovía","Acciones":2},"texto":"Al inicio, roba Destino: 1. Coloca la unidad de Marines en el espacio Inicial de la Ruta Destinada. 2. +4 de Munición. Los Marines mueven 1 espacio cada fase 4R y hasta 3 por Acción de Mover. 1 columna a favor al combatir; disparos de Largo Alcance con 1 en contra.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_marines.jpg"},{"tipo":"Evento","id":"materiales","nombre":"Materiales de Investigación","color":"Naranja (Nivel IV)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":0,"Zeds":"Bosque → Túnel → Montaña","Acciones":2},"texto":"Al final de esta fase: si una unidad de jugador está en el espacio de la Central Nuclear, revela sin coste la siguiente carta de Investigación. (¡Botín!)","codigo":["phases.js › eventEnd: al final de la fase de Acciones"],"img":"assets/cartas/e_materiales.jpg"},{"tipo":"Evento","id":"mina","nombre":"¡Explosión en la Mina!","color":"Azul (Juego Básico y Nivel I)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"No","Alimentación":0,"Zeds":"Montaña → Afueras → Autovía","Acciones":2},"texto":"Al inicio: cualquier unidad en la Mina Lucky Strike sufre 1 Impacto y debe retirarse. Ninguna unidad podrá entrar en ese espacio durante el resto del turno («No Pasar»).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_mina.jpg"},{"tipo":"Evento","id":"misiles","nombre":"Misiles del dron del Ejército","color":"Naranja (Nivel IV)","acto":4,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"Bosque → Túnel → Túnel","Acciones":1},"texto":"Al inicio: elige un espacio ocupado por Zeds en la superficie y tira 1 dado: 1-2 → 1 Impacto a una unidad Zed allí; 3-4 → 2 Impactos en total; 5-6 → 3 Impactos en total.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_misiles.jpg"},{"tipo":"Evento","id":"misterioso","nombre":"El misterioso Dr. Marteuse","color":"Naranja (Nivel IV)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":0,"Infección":"No","Alimentación":0,"Zeds":"Túnel → Autovía → Afueras","Acciones":4},"texto":"Al inicio: 1. Tienes que descartar una carta de Destino de «Guardar para más tarde» (sin jugarla), si tienes alguna. 2. Aumenta la Infección en 1 dado. 3. Coloca una nueva unidad Zed en el espacio Inicial de cada ruta (límite de agrupamiento).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_misterioso.jpg"},{"tipo":"Evento","id":"monstruo","nombre":"¿Quién es el verdadero monstruo, Doc?","color":"Amarillo (Nivel III)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Afueras → Autovía","Acciones":0},"texto":"Durante esta fase puedes «dar de alta» del Hospital hasta 2 unidades (solamente) y mandarlas al Cementerio: revela sin coste la siguiente carta de Investigación por cada unidad «dada de alta» de esta forma.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_monstruo.jpg"},{"tipo":"Evento","id":"moteros","nombre":"Banda de moteros Los Ángeles de Petra","color":"Amarillo (Nivel III)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Autovía → Autovía","Acciones":3},"texto":"Al inicio: 1. Coloca la unidad (Civiles Especiales) Ángeles de Petra en el Centro de la Ciudad. 2. −1 Suministro; no hay penalización si no puedes perder esa cantidad.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_moteros.jpg"},{"tipo":"Evento","id":"murcielagos","nombre":"Enjambre de murciélagos del Túnel","color":"Naranja (Nivel IV)","acto":1,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Bosque → Túnel → Túnel","Acciones":3},"texto":"Al inicio, Después, busca la unidad de jugador que esté en la ruta del Túnel y más alejada del Centro de la Ciudad. ¡Ha molestado a una colonia de murciélagos infectados! Resuelve de inmediato: 1. +1 de Infección. 2. Esa unidad sufre 1 Impacto y se retira.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_murcielagos.jpg"},{"tipo":"Evento","id":"negacion","nombre":"La negación no es un río de Egipto","color":"Azul (Juego Básico y Nivel I)","acto":1,"especial":false,"expansion":2,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Bosque → Autovía","Acciones":2},"texto":"Durante esta fase, las unidades de jugador en un espacio adyacente a unidades Zed no pueden realizar Acciones de Mover ni ataques con Arma de Fuego.","codigo":["bandera de turno: sin Mover ni disparar junto a Zeds (fase de Acciones)"],"img":"assets/cartas/e_negacion.jpg"},{"tipo":"Evento","id":"no_comer","nombre":"No den de comer a los Zeds","color":"Naranja (Nivel IV)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Túnel → Túnel → Autovía","Acciones":2},"texto":"Al inicio: 1. Retira 1 Impacto, si es posible, a cada unidad Zed Normal en o adyacente a un espacio de Pueblo o Ciudad que no tenga unidades de jugador en él.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_no_comer.jpg"},{"tipo":"Evento","id":"no_detendran","nombre":"¡No se detendrán ante nada!","color":"Rojo (Nivel V)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Montaña → Montaña → Túnel → Túnel","Acciones":2},"texto":"Durante esta fase las unidades defensoras no reciben Modificadores por Terreno. Los Zeds destruyen de inmediato cualquier Barricada en un espacio al que entren, antes de resolver cualquier combate Cuerpo a Cuerpo en ese espacio.","codigo":["bandera de turno: los defensores no reciben Modificador por Terreno","bandera de turno: los Zeds destruyen Barricadas al entrar"],"img":"assets/cartas/e_no_detendran.jpg"},{"tipo":"Evento","id":"no_escapatoria","nombre":"No hay escapatoria","color":"Rojo (Nivel V)","acto":4,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Autovía → Afueras → Túnel → Túnel","Acciones":2},"texto":"Durante esta fase, tras el primer ataque Zed, ningún bando se retira: en su lugar, la unidad u Horda Zed ataca de inmediato otra vez (si puede). No puedes usar habilidades para evitar el segundo ataque.","codigo":["bandera de turno: tras el primer ataque Zed nadie se retira"],"img":"assets/cartas/e_no_escapatoria.jpg"},{"tipo":"Evento","id":"no_hay_tiempo","nombre":"¡No hay tiempo para eso!","color":"Azul (Juego Básico y Nivel I)","acto":2,"especial":false,"expansion":2,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":2,"Zeds":"la ruta con menos Zeds, 2 veces","Acciones":3},"texto":"Al inicio de esta fase, gira todas las fichas de Acción de Jugador a su cara de Usada: esas Acciones no están disponibles durante este turno.","codigo":["al inicio de Acciones: la Acción de Jugador queda Usada"],"img":"assets/cartas/e_no_hay_tiempo.jpg"},{"tipo":"Evento","id":"noche","nombre":"Al caer la noche","color":"Azul (Juego Básico y Nivel I)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Autovía → Bosque","Acciones":4},"texto":"Al inicio: +1 de Infección por cada unidad Zed en la ruta de la Autovía. Coloca un nuevo Zed en su espacio Inicial. Sin Modificador por Terreno para los defensores durante esta fase.","codigo":["al inicio de los Zeds: +1 Infección por cada Zed de la ruta y un Zed nuevo en su Inicial"],"img":"assets/cartas/e_noche.jpg"},{"tipo":"Evento","id":"noelle","nombre":"Noelle «Hell» Razer","color":"Amarillo (Nivel III)","acto":1,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Autovía → Bosque","Acciones":1},"texto":"Al inicio, roba Destino y coloca la unidad con peana de Noelle (Propagadora de Enfermedad) en el Inicial de la Ruta Destinada. Mientras esté en juego fuera de un espacio Inicial: +1 de Infección al inicio de cada fase de Infección.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_noelle.jpg"},{"tipo":"Evento","id":"odio","nombre":"Odio cuando pasa eso","color":"Azul (Juego Básico y Nivel I)","acto":4,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Autovía → Afueras → Afueras","Acciones":3},"texto":"Al inicio: sustituye todas las unidades Zed Normales de Fuerza 3 o menos por nuevas unidades al azar con Fuerza completa (empezando por las más cercanas al Centro). Si tenían fichas, se descartan.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_odio.jpg"},{"tipo":"Evento","id":"oh_malo","nombre":"Oh, esto es malo…","color":"Verde (Nivel II)","acto":4,"especial":true,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":0,"Infección":"No","Alimentación":"1 dado","Zeds":"*","Acciones":3},"texto":"Al inicio: 1. Roba Destino y coloca una unidad Zed en el espacio n.º 1 de la Ruta Destinada (límite de agrupamiento). 2. Retira todas las fichas de Impacto de los Zeds. Después se activan todas las rutas (tú eliges el orden).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_oh_malo.jpg"},{"tipo":"Evento","id":"oh_no","nombre":"¡Oh, no! ¡Otra vez no!","color":"Rojo (Nivel V)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Afueras → Autovía → Bosque","Acciones":2},"texto":"Al inicio: revisa las fichas de Mejora Zed (Inteligentes, Rápidos, etc.) que se hayan usado y retirado de la partida, si las hay. Elige una de ellas y colócala en la unidad Zed Normal más fuerte (a tu elección si hay empate).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_oh_no.jpg"},{"tipo":"Evento","id":"panico","nombre":"El pánico es autopreservación","color":"Azul (Juego Básico y Nivel I)","acto":1,"especial":false,"expansion":1,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"*","Acciones":2},"texto":"Durante esta fase, son gratis todas las Acciones de Mover hacia el Centro de la Ciudad que realicen las unidades que estén adyacentes a alguna unidad Zed.","codigo":["bandera de turno: Mover gratis hacia el Centro (fase de Acciones)"],"img":"assets/cartas/e_panico.jpg"},{"tipo":"Evento","id":"pelo","nombre":"¿Me tomas el pelo?","color":"Azul (Juego Básico y Nivel I)","acto":2,"especial":true,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":2,"Infección":"No","Alimentación":"1 dado","Zeds":"*","Acciones":1},"texto":"Al inicio: 1. Coloca un nuevo Zed en el espacio Inicial de cada ruta (límite de agrupamiento). 2. Retira todas las fichas de Impacto de los Zeds. Después se activan todas las rutas (tú eliges el orden).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_pelo.jpg"},{"tipo":"Evento","id":"propagacion","nombre":"La «propagación» de la enfermedad Zed","color":"Azul (Juego Básico y Nivel I)","acto":2,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Autovía → Bosque → Bosque","Acciones":3},"texto":"Al inicio, roba Destino: coloca un nuevo Zed en el espacio Inicial de la Ruta Destinada. Durante este turno, por cada unidad de Civiles Normales eliminada o enviada al Hospital tras su tirada de Salvación, coloca un nuevo Zed en el espacio donde estaba.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_propagacion.jpg"},{"tipo":"Evento","id":"que_demonios","nombre":"¿Qué demonios es eso?","color":"Verde (Nivel II)","acto":4,"especial":true,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"No","Alimentación":"1 dado","Zeds":"*","Acciones":2},"texto":"Al inicio: 1. Aumenta la Infección de inmediato hasta 13 y resuelve un Brote Descontrolado. 2. Retira todas las fichas de Impacto de los Zeds. Después se activan todas las rutas (tú eliges el orden).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_que_demonios.jpg"},{"tipo":"Evento","id":"que_diablos","nombre":"¿Qué diablos? ¿Hay más?","color":"Amarillo (Nivel III)","acto":3,"especial":true,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":2,"Infección":"No","Alimentación":"1 dado","Zeds":"*","Acciones":2},"texto":"Al inicio: 1. Cada unidad Zed en un espacio con nombre se recupera a su cara de Fuerza completa. 2. Retira todas las fichas de Impacto de los Zeds. Después se activan todas las rutas.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_que_diablos.jpg"},{"tipo":"Evento","id":"que_olor","nombre":"¿Qué es ese olor?","color":"Azul (Juego Básico y Nivel I)","acto":4,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":2,"Zeds":"Autovía → Montaña → Bosque","Acciones":2},"texto":"Al final de esta fase: elige una unidad de jugador que no esté en el Centro; coloca una unidad Zed Normal por su cara de Fuerza reducida en ese espacio y resuelve un combate Cuerpo a Cuerpo normal. Si la unidad Zed sobrevive y gana, dale la vuelta a su cara de Fuerza completa (conserva sus Impactos). Si pierde, se retira.","codigo":["phases.js › eventAfterZeds: al final de la fase de los Zeds"],"img":"assets/cartas/e_que_olor.jpg"},{"tipo":"Evento","id":"queda_alguno","nombre":"¿Queda alguno?","color":"Azul (Juego Básico y Nivel I)","acto":"Fin","especial":false,"expansion":1,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"*","Acciones":0},"texto":"¡Habéis ganado! «¿Han cesado? ¿Queda alguno? Espera, ¿quién eres tú?»","codigo":["carta de Fin: se gana al terminar la fase de los Zeds (inicio de Acciones)"],"img":"assets/cartas/e_queda_alguno.jpg"},{"tipo":"Evento","id":"rapidos","nombre":"Zeds Rápidos","color":"Verde (Nivel II)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Bosque → Bosque","Acciones":2},"texto":"Al inicio: 1. Coloca un nuevo Zed en el Inicial del Bosque. 2. Pon la ficha de Rápidos en el Zed Normal más fuerte: se mueve dos veces cada vez que se activa (luchando tras cada movimiento).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_rapidos.jpg"},{"tipo":"Evento","id":"renqueantes","nombre":"Zeds renqueantes","color":"Naranja (Nivel IV)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":0,"Zeds":"Bosque → Autovía → Autovía → Túnel","Acciones":2},"texto":"Al inicio, roba Destino: elige una unidad de Civiles o Héroe en la Ruta Destinada (no en el Centro ni en un espacio Inicial): sufre un ataque Cuerpo a Cuerpo en la columna «Igual» (aplica Terreno). Solo sufre Impactos, no se retira.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_renqueantes.jpg"},{"tipo":"Evento","id":"resiste","nombre":"Resiste con más fuerza cuando resistas en soledad","color":"Azul (Juego Básico y Nivel I)","acto":2,"especial":false,"expansion":2,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"No","Alimentación":0,"Zeds":"Autovía → Afueras","Acciones":2},"texto":"(Efecto de Presión Zed: se ignora en solitario.)","codigo":[],"img":"assets/cartas/e_resiste.jpg"},{"tipo":"Evento","id":"resistentes","nombre":"Zeds Resistentes","color":"Azul (Juego Básico y Nivel I)","acto":3,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"Montaña → Montaña","Acciones":3},"texto":"Al inicio: 1. Coloca un nuevo Zed en el Inicial de la Montaña. 2. Pon la ficha de Resistentes en la unidad Zed Normal más fuerte (a tu elección si hay empate): cada Impacto que reciba se anula con 1-3 en un dado.","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_resistentes.jpg"},{"tipo":"Evento","id":"rumores","nombre":"Rumores de contagio por el aire","color":"Naranja (Nivel IV)","acto":2,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"No","Alimentación":2,"Zeds":"*","Acciones":1},"texto":"No pueden realizarse Acciones de Mover en la superficie durante esta fase (el viento transmite la enfermedad y paraliza cualquier movimiento).","codigo":["bandera de turno: sin Mover por la superficie (fase de Acciones)"],"img":"assets/cartas/e_rumores.jpg"},{"tipo":"Evento","id":"saqueadores","nombre":"¡Aparecen Saqueadores!","color":"Verde (Nivel II)","acto":3,"especial":false,"expansion":0,"fase":"4","faseNombre":"Fase 4R","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":"1 dado","Zeds":"Afueras → Bosque","Acciones":1},"texto":"Al inicio: coloca la unidad de Saqueadores en el Inicial de la ruta de superficie con más Caos (a tu elección si hay empate). Se mueve 1 espacio por turno hacia el Centro, incluyendo este turno. Si llega, pierdes Suministros y Munición igual a su Fuerza.","codigo":["phases.js › eventEffect: al inicio de la fase 4R"],"img":"assets/cartas/e_saqueadores.jpg"},{"tipo":"Evento","id":"shhh","nombre":"¡Shhh! Sé que están ahí fuera…","color":"Azul (Juego Básico y Nivel I)","acto":3,"especial":false,"expansion":2,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"No","Alimentación":"1 dado","Zeds":"solo los Zeds de espacios Iniciales","Acciones":3},"texto":"Los ataques con Arma de Fuego y Cuerpo a Cuerpo no están permitidos durante esta fase. Las Acciones de Mover no pueden finalizar de manera que una unidad de Jugador acabe en un espacio controlado por Zeds.","codigo":["bandera de turno: sin ataques (fase de Acciones)"],"img":"assets/cartas/e_shhh.jpg"},{"tipo":"Evento","id":"soldados","nombre":"Soldados de fortuna","color":"Amarillo (Nivel III)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":0,"Zeds":"Montaña → Bosque","Acciones":4},"texto":"Durante esta fase, todos tus ataques con Arma de Fuego obtienen 1 columna a favor y no gastan Munición. Al final de esta fase, tira 1 dado para determinar cuánto se paga a estos mercenarios: pierdes esa cantidad en cualquier combinación de Suministros o Impactos a unidades de jugador.","codigo":["phases.js › eventEnd: al final de la fase de Acciones","bandera de turno: +1 columna en los disparos (fase de Acciones)"],"img":"assets/cartas/e_soldados.jpg"},{"tipo":"Evento","id":"super_enloq","nombre":"Los Súper Zeds enloquecen","color":"Amarillo (Nivel III)","acto":3,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":0,"Infección":"tirada de Brote","Alimentación":2,"Zeds":"*","Acciones":4},"texto":"Al final de esta fase: activa todos los Súper Zeds (únicamente), empezando por los más cercanos al Centro. Reciben 2 columnas en contra al atacar durante esta activación.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones","phases.js › eventEnd: al final de la fase de Acciones"],"img":"assets/cartas/e_super_enloq.jpg"},{"tipo":"Evento","id":"toxicos","nombre":"Zeds Tóxicos","color":"Verde (Nivel II)","acto":2,"especial":false,"expansion":0,"fase":"a","faseNombre":"Fase de Acciones","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"Autovía → Autovía","Acciones":2},"texto":"Al inicio: 1. Coloca un nuevo Zed en el Inicial de la Autovía. 2. Pon la ficha de Tóxicos en el Zed Normal más fuerte: sus combates (y los de su Horda) suben la Infección +3 en vez de +1 hasta que sea eliminado.","codigo":["phases.js › eventEffect: al inicio de la fase de Acciones"],"img":"assets/cartas/e_toxicos.jpg"},{"tipo":"Evento","id":"tsunami","nombre":"Tsunami zombi","color":"Amarillo (Nivel III)","acto":2,"especial":false,"expansion":0,"fase":"z","faseNombre":"Fase de los Zeds","columnas":{"4R":1,"Infección":"tirada de Brote","Alimentación":1,"Zeds":"*","Acciones":3},"texto":"Al inicio: coloca una nueva unidad Zed en el espacio Inicial de cada ruta (límite de agrupamiento).","codigo":["phases.js › eventEffect: al inicio de la fase de los Zeds"],"img":"assets/cartas/e_tsunami.jpg"},{"tipo":"Evento","id":"turba","nombre":"Aparece una turba no identificada","color":"Verde (Nivel II)","acto":3,"especial":false,"expansion":0,"fase":"4","faseNombre":"Fase 4R","columnas":{"4R":2,"Infección":"tirada de Brote","Alimentación":0,"Zeds":"Montaña → Autovía","Acciones":3},"texto":"Al inicio, roba Destino: 1. Si la Infección es 8 o mayor, coloca una nueva unidad de Súper Zeds en el Inicial de la ruta. 2. Si es 7 o menor, coloca en su lugar a los Supervivientes V.I.P. (Refugiados especiales).","codigo":["phases.js › eventEffect: al inicio de la fase 4R"],"img":"assets/cartas/e_turba.jpg"},{"tipo":"Destino","id":"adrenalina","nombre":"Suministro de adrenalina","color":"Azul (Juego Básico y Nivel I)","ruta":"F","guardar":true,"texto":"Juega esta carta durante la fase de Acciones para obtener 2 Acciones de Evento adicionales.","img":"assets/cartas/d_adrenalina.jpg"},{"tipo":"Destino","id":"alimanas","nombre":"Alimañas Infectadas","color":"Azul (Juego Básico y Nivel I)","ruta":"A","guardar":false,"texto":"Coloca la unidad en peana de Alimañas Infectadas (Propagadoras de Enfermedad) en el espacio Inicial de la ruta con más unidades Zed. +1 de Infección al inicio de cada fase de Infección mientras estén en juego fuera de un espacio Inicial, hasta que sea eliminada.","img":"assets/cartas/d_alimanas.jpg"},{"tipo":"Destino","id":"averia","nombre":"Avería grave","color":"Rojo (Nivel V)","ruta":"B","guardar":false,"texto":"Retira 1 Componente de la Súper Arma si has descubierto la Súper Arma. De lo contrario: a) coge al azar una carta de Investigación Inicial y ponla encima del mazo, o bien b) activa la ruta (moviendo las unidades Zed con normalidad) con menos Zeds (elige en caso de empate).","img":"assets/cartas/d_averia.jpg"},{"tipo":"Destino","id":"barrelotodo","nombre":"Don Barrelotodo","color":"Naranja (Nivel IV)","ruta":"less","guardar":true,"texto":"Juega esta carta en cualquier momento para retirar 2 fichas de Caos (sin aumento de Infección).","img":"assets/cartas/d_barrelotodo.jpg"},{"tipo":"Destino","id":"bubba","nombre":"Banda de Bubba DeNardo","color":"Amarillo (Nivel III)","ruta":"choice","guardar":false,"texto":"Coloca la unidad de Saqueadores Banda de Bubba en el espacio Inicial de la ruta con menos unidades Zed. Mueve 1 espacio por turno durante la fase 4R hacia el Centro. Si llega, pierdes Suministros y Munición igual a su Fuerza y las unidades en un espacio de Ciudad o el Centro sufren 1 Impacto. 1 columna a favor en todos sus combates.","img":"assets/cartas/d_bubba.jpg"},{"tipo":"Destino","id":"cama","nombre":"De la cama del hospital al fragor de la batalla","color":"Naranja (Nivel IV)","ruta":"T","guardar":true,"texto":"Durante la fase de Acciones, juega esta carta para Curar sin coste a cualquier unidad de Civiles en el Hospital (a su máximo de salud, pero solo reduces 1 de Infección). Después, coloca esa unidad en un espacio de la superficie con nombre que no esté controlado por Zeds.","img":"assets/cartas/d_cama_hospital.jpg"},{"tipo":"Destino","id":"candado","nombre":"Un candado oxidado","color":"Naranja (Nivel IV)","ruta":"M","guardar":false,"texto":"Retira 1 Componente de la Súper Arma si has descubierto alguno; si no, pon una carta de Investigación Inicial al azar encima del mazo. Coloca una nueva unidad Zed en el Inicial de la ruta con menos Zeds.","img":"assets/cartas/d_candado.jpg"},{"tipo":"Destino","id":"canon","nombre":"Cañón histórico de Farmingdale","color":"Rojo (Nivel V)","ruta":"T","guardar":true,"texto":"Juega esta carta durante la fase de Acciones para realizar un ataque gratuito con Arma de Fuego de Fuerza 5 contra cualquier espacio n.º 0 ó n.º 1 (sin consumir Munición ni usar la Súper Arma). Después tira 1 dado: 1-5 = descarta la carta; 6 = guárdala.","img":"assets/cartas/d_canon.jpg"},{"tipo":"Destino","id":"civiles","nombre":"Algunos civiles se organizan","color":"Azul (Juego Básico y Nivel I)","ruta":"less","guardar":true,"texto":"Juega esta carta al principio de cualquier fase o antes de cualquier combate para colocar la ficha de Líder Civil en una unidad de Civiles Normales. Hasta que acabe en el Cementerio, esa unidad recibe 1 columna a favor en todos los combates Cuerpo a Cuerpo y ataques con Arma de Fuego.","img":"assets/cartas/d_civiles.jpg"},{"tipo":"Destino","id":"contagio","nombre":"Contagio mortífero","color":"Rojo (Nivel V)","ruta":"choice","guardar":false,"texto":"Resuelve de inmediato un Brote Descontrolado (¡pero no reduzcas la Infección!). Además, coloca una unidad que esté en el Centro de la Ciudad (si hay alguna) en el Hospital con solo 1 Impacto restante.","img":"assets/cartas/d_contagio.jpg"},{"tipo":"Destino","id":"coordinador","nombre":"Coordinador de la comunidad","color":"Azul (Juego Básico y Nivel I)","ruta":"M","guardar":true,"texto":"Juega esta carta durante la fase de Acciones para colocar una nueva unidad de Civiles Normales o Heroicos disponible a tu elección en el Centro de la Ciudad.","img":"assets/cartas/d_coordinador.jpg"},{"tipo":"Destino","id":"desesperados","nombre":"Tiempos desesperados, medidas desesperadas","color":"Naranja (Nivel IV)","ruta":"less","guardar":true,"texto":"Juega esta carta en cualquier momento. Gasta 1 de Munición para reducir la Infección en 5 inmediatamente.","img":"assets/cartas/d_desesperados.jpg"},{"tipo":"Destino","id":"discutiendo","nombre":"¡Estáis discutiendo por estupideces!","color":"Azul (Juego Básico y Nivel I)","ruta":"A","guardar":false,"texto":"Elige a dos unidades de jugador que estén en el mismo espacio: no pueden realizar (más) Acciones durante este turno.","img":"assets/cartas/d_discutiendo.jpg"},{"tipo":"Destino","id":"excavadora","nombre":"Excavadora asesina","color":"Azul (Juego Básico y Nivel I)","ruta":"choice","guardar":true,"texto":"Juega esta carta cuando una unidad de jugador comience un ataque Cuerpo a Cuerpo para que obtenga 2 columnas a favor en ese combate.","img":"assets/cartas/d_excavadora.jpg"},{"tipo":"Destino","id":"expediente","nombre":"Expediente del Proyecto Farmingdale","color":"Naranja (Nivel IV)","ruta":"T","guardar":true,"texto":"Juega esta carta durante la fase de Acciones cuando tengas una unidad de jugador en la Oficina del Dr. Marteuse: revela sin coste la siguiente carta del mazo de Investigación.","img":"assets/cartas/d_expediente.jpg"},{"tipo":"Destino","id":"exploradores","nombre":"Grupos de exploradores desplegados","color":"Amarillo (Nivel III)","ruta":"lessC","guardar":true,"texto":"Juega esta carta en cualquier momento para mover cada unidad de Refugiados (incluyendo Supervivientes V.I.P.) que esté en un espacio adyacente a una unidad Zed 1 espacio más cerca del Centro de la Ciudad.","img":"assets/cartas/d_exploradores.jpg"},{"tipo":"Destino","id":"ferrea","nombre":"Férrea determinación en la última batalla","color":"Azul (Juego Básico y Nivel I)","ruta":"A","guardar":true,"texto":"Juega esta carta después de que una unidad Zed ataque y gane. Cambia el resultado del combate a: los Zeds atacantes sufren 1 Impacto y se retiran.","img":"assets/cartas/d_ferrea.jpg"},{"tipo":"Destino","id":"florecimiento","nombre":"El florecimiento","color":"Rojo (Nivel V)","ruta":"lessC","guardar":false,"texto":"Reemplaza la unidad Zed más débil (incluso si es Propagador o Súper Zed) por una nueva unidad Zed Normal. Si hay empate, reemplaza todas las unidades más débiles por nuevas unidades Zed Normales. Retira todas las fichas de Impacto de las unidades Zed.","img":"assets/cartas/d_florecimiento.jpg"},{"tipo":"Destino","id":"hedor","nombre":"Zeds que segregan un hedor nocivo","color":"Amarillo (Nivel III)","ruta":"B","guardar":false,"texto":"Coloca la ficha de Pestilentes en la unidad Zed más alejada del Centro de la Ciudad (la más fuerte si hay empate). Si esta unidad se mueve sin iniciar un combate y hay unidades que no sean Zeds en el espacio delante, la unidad Zed realiza un ataque con Arma de Fuego contra ellas, sin Terreno.","img":"assets/cartas/d_hedor.jpg"},{"tipo":"Destino","id":"heli_noticias","nombre":"Encuentras el helicóptero de las Noticias-12","color":"Rojo (Nivel V)","ruta":"moreC","guardar":true,"texto":"Juega esta carta cuando un Héroe realice una Acción de Mover para recogerlo de cualquier espacio en la superficie y colocarlo en cualquier otro espacio de la superficie. El Hospital y el Laboratorio se consideran espacios en la superficie.","img":"assets/cartas/d_helicoptero_noticias.jpg"},{"tipo":"Destino","id":"heroe_d","nombre":"Llega un Héroe","color":"Naranja (Nivel IV)","ruta":"more","guardar":true,"texto":"Juega esta carta durante la fase de Acciones para colocar una nueva unidad de Héroe disponible, cogida al azar, en el Centro de la Ciudad o en cualquier espacio Inicial.","img":"assets/cartas/d_llega_heroe.jpg"},{"tipo":"Destino","id":"hija","nombre":"¡La hija del alcalde ha desaparecido!","color":"Azul (Juego Básico y Nivel I)","ruta":"B","guardar":false,"texto":"Las unidades de jugador en el Centro de la Ciudad no pueden mover durante el resto del turno.","img":"assets/cartas/d_hija.jpg"},{"tipo":"Destino","id":"hipnotizados","nombre":"Zeds hipnotizados","color":"Rojo (Nivel V)","ruta":"T","guardar":true,"texto":"Juega esta carta durante la fase de Zeds para cancelar todas las activaciones Zed en una ruta cualquiera.","img":"assets/cartas/d_hipnotizados.jpg"},{"tipo":"Destino","id":"hoguera","nombre":"Hoguera macabra","color":"Amarillo (Nivel III)","ruta":"less","guardar":true,"texto":"Usas unas reservas de queroseno para quemar cuerpos infectados. Juégala en cualquier momento para reducir la Infección en 2.","img":"assets/cartas/d_hoguera.jpg"},{"tipo":"Destino","id":"inventarios","nombre":"Inventarios amañados","color":"Verde (Nivel II)","ruta":"choice","guardar":false,"texto":"El interventor Jon Stengel ha descubierto que faltan recursos. Tira 1 dado para Suministros y después otro para Munición: 1-2 → −2 Suministros/Munición; 3-5 → −1; 6 → sin efecto. Sin penalización si no tienes tanto.","img":"assets/cartas/d_inventarios.jpg"},{"tipo":"Destino","id":"lago","nombre":"Zeds surgidos del lago","color":"Azul (Juego Básico y Nivel I)","ruta":"more","guardar":false,"texto":"Coloca una nueva unidad Zed en el espacio del Campamento. Si es necesario, aplica el límite de agrupamiento.","img":"assets/cartas/d_lago.jpg"},{"tipo":"Destino","id":"llamamiento","nombre":"Llamamiento zombi","color":"Verde (Nivel II)","ruta":"F","guardar":false,"texto":"Por cada espacio con Caos, coge una nueva unidad Zed de la reserva. Si su Fuerza completa es menor que el n.º de ese espacio, colócala allí; si no, devuélvela a la reserva. Sigue con el siguiente espacio con Caos.","img":"assets/cartas/d_llamamiento.jpg"},{"tipo":"Destino","id":"lluvia","nombre":"Lluvia torrencial","color":"Verde (Nivel II)","ruta":"lessC","guardar":false,"texto":"No se permite más movimiento en la ruta de la Montaña durante el resto de este turno. Tira 1 dado por cada unidad Zed en esa ruta: 1-2 = arrastrada 1 espacio hacia el Centro; 3-5 = nada; 6 = empujada 1 espacio lejos del Centro. Resuelve ataques y retiradas normalmente.","img":"assets/cartas/d_lluvia.jpg"},{"tipo":"Destino","id":"muertos","nombre":"¡Los muertos vivientes!","color":"Azul (Juego Básico y Nivel I)","ruta":"M","guardar":false,"texto":"¡El histórico cementerio de St. Thomas está rebosante de no muertos! Coloca 2 nuevas unidades Zed Normales formando una Horda Zed en el espacio de Pueblo de St. Thomas. Aplica el límite de agrupamiento si es necesario.","img":"assets/cartas/d_muertos.jpg"},{"tipo":"Destino","id":"municion","nombre":"Munición defectuosa y suministros caducados","color":"Azul (Juego Básico y Nivel I)","ruta":"B","guardar":false,"texto":"Sufres una pérdida de 2 Suministros y 1 de Munición de inmediato. Si no tienes suficiente, no hay ninguna penalización adicional.","img":"assets/cartas/d_municion.jpg"},{"tipo":"Destino","id":"necesidad","nombre":"La necesidad agudiza el ingenio","color":"Rojo (Nivel V)","ruta":"F","guardar":true,"texto":"Juega esta carta durante la fase de Acciones para convertir 2 Suministros en 1 de Munición. Puedes hacer esto tantas veces como quieras este turno.","img":"assets/cartas/d_necesidad.jpg"},{"tipo":"Destino","id":"olvidado","nombre":"¿Qué te has olvidado?","color":"Verde (Nivel II)","ruta":"M","guardar":false,"texto":"Todas las unidades de Refugiados (incluyendo Supervivientes V.I.P.) deben alejarse 1 espacio del Centro de la Ciudad. Si entran en un espacio con Zeds, ¡son devorados!","img":"assets/cartas/d_olvidado.jpg"},{"tipo":"Destino","id":"otra_manera","nombre":"Lo haremos de otra manera","color":"Amarillo (Nivel III)","ruta":"more","guardar":false,"texto":"Por cada unidad de Refugiados en el Campamento de Refugiados (si hay), tira 1 dado: 1 = retira la unidad de Refugiados de la partida; 2-5 = sin efecto; 6 = los Refugiados se quedan y puedes Curar 1 Impacto a cualquier unidad de Civiles (reduce la Infección con normalidad).","img":"assets/cartas/d_otra_manera.jpg"},{"tipo":"Destino","id":"pensar","nombre":"Pensar fríamente supuso el triunfo","color":"Azul (Juego Básico y Nivel I)","ruta":"F","guardar":true,"texto":"Juega esta carta para cancelar cualquier evento «Juega esta carta» que robes más adelante; O BIEN repite cualquier resultado de 1 dado o de 2 dados en el que haya un 1 (si es doble 1, repite los dos dados).","img":"assets/cartas/d_pensar.jpg"},{"tipo":"Destino","id":"picado","nombre":"¡Sí! Han picado… Esta vez","color":"Verde (Nivel II)","ruta":"B","guardar":true,"texto":"Juega esta carta durante la fase de los Zeds para cancelar toda la activación de una unidad u Horda Zed antes de que se mueva. Recupera 1 Impacto si estaba herida. Después tira 1 dado: 1-3 = descarta esta carta; 4-6 = guárdala para un futuro uso.","img":"assets/cartas/d_picado.jpg"},{"tipo":"Destino","id":"planes","nombre":"Los diabólicos planes del Dr. Marteuse","color":"Naranja (Nivel IV)","ruta":"T","guardar":false,"texto":"Roba otra carta de Destino para determinar la ruta. Después, tira 1 dado por cada espacio con Caos en esa ruta: 1-3 = coloca ahí una nueva unidad Zed; 4-6 = sin efecto. Después coloca una nueva unidad Zed en el espacio Inicial de cada ruta.","img":"assets/cartas/d_planes_marteuse.jpg"},{"tipo":"Destino","id":"protestas","nombre":"¡Protestas ProZeds!","color":"Naranja (Nivel IV)","ruta":"choice","guardar":false,"texto":"Tira 1 dado y aplica el resultado como pérdidas en cualquier combinación de: a) Suministros, b) Munición, c) Incrementos de Infección, d) Impactos a unidades de jugador.","img":"assets/cartas/d_protestas.jpg"},{"tipo":"Destino","id":"puente","nombre":"El puente se derrumba","color":"Verde (Nivel II)","ruta":"F","guardar":false,"texto":"Coloca la ficha de Puente Derrumbado en el espacio del Puente colgante. Las unidades de jugador y Saqueadores no pueden entrar en él. Puedes gastar 1 Acción para darle la vuelta a la cara de Ferry: se puede entrar pero el movimiento termina allí.","img":"assets/cartas/d_puente.jpg"},{"tipo":"Destino","id":"punto_partida","nombre":"De vuelta al punto de partida","color":"Amarillo (Nivel III)","ruta":"A","guardar":false,"texto":"Tira 1 dado: 1-2 = coge 2 cartas de Investigación Inicial al azar y ponlas encima del mazo de Investigación; 3-5 = coge 1; 6 = sin efecto.","img":"assets/cartas/d_punto_partida.jpg"},{"tipo":"Destino","id":"senal","nombre":"La señal de rescate trae un envío de suministros","color":"Rojo (Nivel V)","ruta":"B","guardar":true,"texto":"Juega esta carta en cualquier momento para obtener 2 Suministros y 2 de Munición.","img":"assets/cartas/d_senal_rescate.jpg"},{"tipo":"Destino","id":"sin_nombre","nombre":"El Hombre sin nombre","color":"Verde (Nivel II)","ruta":"moreC","guardar":true,"texto":"Juega esta carta al inicio de cualquier combate Cuerpo a Cuerpo para obtener 3 columnas a favor, de un solo uso.","img":"assets/cartas/d_hombre.jpg"},{"tipo":"Destino","id":"techo","nombre":"El techo del Túnel se derrumba","color":"Naranja (Nivel IV)","ruta":"T","guardar":false,"texto":"Tira 1 dado para determinar qué espacio del Túnel queda sepultado. Nadie puede entrar en ese espacio durante este turno («No Pasar»). Cualquier unidad en ese espacio sufre 1 Impacto y escapa: del n.º 6 a la Central Nuclear; del n.º 5 a la Universidad; del n.º 4 a la Mina; del n.º 3 a la Granja; de los n.º 1 y 2 se retiran 1 espacio.","img":"assets/cartas/d_techo_tunel.jpg"},{"tipo":"Destino","id":"tiradles","nombre":"¡Tiradles algo!","color":"Naranja (Nivel IV)","ruta":"A","guardar":true,"texto":"Juega esta carta cuando una de tus unidades sea atacada en combate Cuerpo a Cuerpo. Antes de resolverlo, realiza un ataque con Arma de Fuego de Fuerza 2 (sin coste de Munición) contra los atacantes. Después continúa con el combate.","img":"assets/cartas/d_tiradles_algo.jpg"},{"tipo":"Destino","id":"trago","nombre":"Un trago para coger fuerzas","color":"Amarillo (Nivel III)","ruta":"F","guardar":true,"texto":"Juega esta carta al inicio de cualquier combate Cuerpo a Cuerpo para obtener 2 columnas a favor de un solo uso. Sin embargo, al final de esa lucha la unidad de jugador sufre 1 Impacto.","img":"assets/cartas/d_trago.jpg"},{"tipo":"Destino","id":"urbanistas","nombre":"¡Los urbanistas contraatacan!","color":"Azul (Juego Básico y Nivel I)","ruta":"M","guardar":true,"texto":"Juega esta carta para eliminar una unidad Zed cualquiera que esté intentando entrar en un espacio de Ciudad.","img":"assets/cartas/d_urbanistas.jpg"},{"tipo":"Destino","id":"vehiculos","nombre":"Vehículos robustos «requisados»","color":"Verde (Nivel II)","ruta":"A","guardar":true,"texto":"Juega esta carta durante la Acción de Mover de un Héroe para obtener 3 puntos de Movimiento adicionales (solo entre espacios de la superficie). No puede usarse con Pepinillos ni Horacio.","img":"assets/cartas/d_vehiculos.jpg"},{"tipo":"Destino","id":"veo_alguien","nombre":"Creo que veo a alguien","color":"Verde (Nivel II)","ruta":"A","guardar":true,"texto":"Juega esta carta durante la fase de Acciones para colocar una nueva unidad de Héroe disponible a tu elección en cualquier espacio Inicial de la superficie.","img":"assets/cartas/d_veo_alguien.jpg"},{"tipo":"Destino","id":"zed_alfa","nombre":"Emerge un Zed alfa","color":"Rojo (Nivel V)","ruta":"F","guardar":false,"texto":"Coloca la ficha de Líder en la unidad Zed Normal más fuerte (la más próxima al Centro en caso de empate). Después, activa su ruta (moviendo todas las unidades Zed situadas en ella con normalidad). La unidad Zed Líder obtiene 1 columna en contra en combate Cuerpo a Cuerpo hasta que sea eliminada.","img":"assets/cartas/d_zed_alfa.jpg"},{"tipo":"Investigación","id":"ahora","nombre":"Campaña del «Ahora o nunca»","clase":"adv","umbral":5,"suministro":true,"permanente":true,"texto":"Mientras esta sea la carta en curso, incrementa en 1 el resultado de tus tiradas de Buscar.","img":"assets/cartas/i_ahora.jpg"},{"tipo":"Investigación","id":"antidoto","nombre":"Avances en el Antídoto","clase":"Especial","umbral":6,"suministro":true,"permanente":false,"texto":"Si el Componente Final no está en el Laboratorio, colócalo y baraja esta carta de nuevo en el mazo de Investigación. Si ya estaba, dale la vuelta (Antídoto): reduce la Infección en 1 al final de cada fase de Mantenimiento.","img":"assets/cartas/i_antidoto.jpg"},{"tipo":"Investigación","id":"antinatural","nombre":"Selección antinatural Zed","clase":"adv","umbral":5,"suministro":true,"permanente":true,"texto":"Mientras esta sea la carta en curso, al colocar cualquier nueva unidad Zed o de Súper Zeds, roba dos unidades de ese tipo y elige cuál de ellas colocar.","img":"assets/cartas/i_antinatural.jpg"},{"tipo":"Investigación","id":"arma1","nombre":"Función para la Súper Arma","clase":"Especial","umbral":5,"suministro":true,"permanente":false,"texto":"Elige un Componente de la Súper Arma y ponlo en juego. Si solo te falta el cuarto Componente, lo recibes únicamente si la Profesora Agee está en el Laboratorio.","img":"assets/cartas/i_arma1.jpg"},{"tipo":"Investigación","id":"arma2","nombre":"Función para la Súper Arma","clase":"Especial","umbral":5,"suministro":true,"permanente":false,"texto":"Elige un Componente de la Súper Arma y ponlo en juego. Si solo te falta el cuarto Componente, lo recibes únicamente si la Profesora Agee está en el Laboratorio.","img":"assets/cartas/i_arma2.jpg"},{"tipo":"Investigación","id":"arma3","nombre":"Función para la Súper Arma","clase":"Especial","umbral":5,"suministro":true,"permanente":false,"texto":"Elige un Componente de la Súper Arma y ponlo en juego. Si solo te falta el cuarto Componente, lo recibes únicamente si la Profesora Agee está en el Laboratorio.","img":"assets/cartas/i_arma3.jpg"},{"tipo":"Investigación","id":"arma4","nombre":"Función para la Súper Arma","clase":"Especial","umbral":5,"suministro":true,"permanente":false,"texto":"Elige un Componente de la Súper Arma y ponlo en juego. Si solo te falta el cuarto Componente, lo recibes únicamente si la Profesora Agee está en el Laboratorio.","img":"assets/cartas/i_arma4.jpg"},{"tipo":"Investigación","id":"atascada","nombre":"Investigación atascada","clase":"adv","umbral":4,"suministro":true,"permanente":false,"texto":"Sin Evento Especial.","img":"assets/cartas/i_atascada.jpg"},{"tipo":"Investigación","id":"cecina","nombre":"Cecina Zed","clase":"Inicial","umbral":5,"suministro":false,"permanente":false,"texto":"Obtienes 2 Suministros.","img":"assets/cartas/i_cecina.jpg"},{"tipo":"Investigación","id":"cientificos","nombre":"Científicos seguros de sí mismos","clase":"Inicial","umbral":5,"suministro":false,"permanente":false,"texto":"Retira 1 ficha de Caos de forma gratuita sin aumentar la Infección.","img":"assets/cartas/i_cientificos.jpg"},{"tipo":"Investigación","id":"dcp","nombre":"Encargo del D.C.P.","clase":"Inicial","umbral":3,"suministro":false,"permanente":false,"texto":"Esta carta se coloca en la pila de descarte del mazo de Investigación. Puedes empezar a investigar la cura para el Z.E.D.","img":"assets/cartas/i_dcp.jpg"},{"tipo":"Investigación","id":"distraccion","nombre":"¡Mira! ¡Una distracción!","clase":"Inicial","umbral":4,"suministro":false,"permanente":true,"texto":"Mientras esta sea la carta en curso, puedes hacer que tus unidades de Civiles Normales sufran 1 Impacto y después se retiren (si sobreviven) para impedir que las unidades Zed adyacentes avancen. No impide la colocación de nuevas unidades Zed.","img":"assets/cartas/i_distraccion.jpg"},{"tipo":"Investigación","id":"escasean","nombre":"Escasean materiales para la Investigación","clase":"Inicial","umbral":5,"suministro":false,"permanente":true,"texto":"Mientras esta sea la carta en curso, puedes gastar 1 Suministro en lugar de 1 Acción para Investigar.","img":"assets/cartas/i_escasean.jpg"},{"tipo":"Investigación","id":"esperanza","nombre":"Rumores de esperanza","clase":"Inicial","umbral":4,"suministro":false,"permanente":true,"texto":"Mientras esta sea la carta en curso, añade +1 a todas tus tiradas de Salvación.","img":"assets/cartas/i_esperanza.jpg"},{"tipo":"Investigación","id":"folletos","nombre":"Distribución de folletos","clase":"Inicial","umbral":5,"suministro":false,"permanente":false,"texto":"Cura hasta dos unidades Civiles 1 Impacto a cada una con las correspondientes reducciones de Infección.","img":"assets/cartas/i_folletos.jpg"},{"tipo":"Investigación","id":"heroe_c","nombre":"Llega un Héroe Científico","clase":"adv","umbral":5,"suministro":true,"permanente":false,"texto":"Coge una nueva unidad de Héroe Científico al azar y colócala en el Centro de la Ciudad.","img":"assets/cartas/i_heroe_c.jpg"},{"tipo":"Investigación","id":"hormona","nombre":"Hormona anticrecimiento","clase":"adv","umbral":5,"suministro":true,"permanente":false,"texto":"Puedes reemplazar una unidad de Súper Zeds por una unidad al azar de Zeds Normales, conservando la cantidad de Impactos que hubieran recibido.","img":"assets/cartas/i_hormona.jpg"},{"tipo":"Investigación","id":"intoxicados","nombre":"Zeds «intoxicados»","clase":"Inicial","umbral":4,"suministro":false,"permanente":true,"texto":"Mientras esta sea la carta de Investigación en Curso, al principio de cada fase de Acciones puedes infligir 1 Impacto a la unidad Zed más débil adyacente a cualquier unidad de Civiles o de Héroe.","img":"assets/cartas/i_intoxicados.jpg"},{"tipo":"Investigación","id":"medio","nombre":"A medio convertir","clase":"Inicial","umbral":4,"suministro":false,"permanente":true,"texto":"Mientras esta sea la carta en curso, todos los Brotes Zed hacen descender automáticamente el nivel de Infección a 2.","img":"assets/cartas/i_medio.jpg"},{"tipo":"Investigación","id":"musica","nombre":"¡Bajad la música!","clase":"Inicial","umbral":5,"suministro":false,"permanente":false,"texto":"Las unidades Zed en un espacio cualquiera se retiran de inmediato.","img":"assets/cartas/i_musica.jpg"},{"tipo":"Investigación","id":"noticias","nombre":"Nos llegaron noticias de tu muerte","clase":"Inicial","umbral":5,"suministro":false,"permanente":false,"texto":"Puedes coger de inmediato una unidad del Cementerio y colocarla en el Centro de la Ciudad con solo 1 Impacto restante.","img":"assets/cartas/i_noticias.jpg"},{"tipo":"Investigación","id":"pruebas","nombre":"Necesita más pruebas","clase":"Inicial","umbral":4,"suministro":false,"permanente":false,"texto":"Pierdes un Componente al azar de la Súper Arma si has descubierto algún Componente. De lo contrario, coge al azar una carta de Investigación Inicial y ponla en la parte superior del mazo.","img":"assets/cartas/i_pruebas.jpg"},{"tipo":"Investigación","id":"sasha","nombre":"Sasha Brooks ofrece su ayuda","clase":"Inicial","umbral":3,"suministro":false,"permanente":false,"texto":"Sin Evento Especial.","img":"assets/cartas/i_sasha.jpg"},{"tipo":"Investigación","id":"uhm","nombre":"Uhm, interesante…","clase":"Inicial","umbral":5,"suministro":false,"permanente":false,"texto":"Reduce la Infección en 2.","img":"assets/cartas/i_uhm.jpg"},{"tipo":"Investigación","id":"vacunas","nombre":"Las vacunas ayudan","clase":"adv","umbral":5,"suministro":true,"permanente":true,"texto":"Mientras esta sea la carta en curso, todos los Brotes colocan las nuevas unidades Zed y de Súper Zeds en los espacios Iniciales.","img":"assets/cartas/i_vacunas.jpg"},{"tipo":"Héroe","id":"agee","nombre":"Profesora Agee","clase":"Científica","fuerza":"2 / 1","movimiento":4,"nivel":3,"expansion":0,"texto":"En una Oficina del Hospital: cada Acción de Curar reduce la Infección en 2. En el Laboratorio: +1 a tiradas de Investigación (máx. 6). Madre de la Ciencia: con la Súper Arma, restaurar el orden reduce la Infección 2. Una vez por turno: +3 Infección a cambio de 1 Acción de Evento extra.","img":"assets/cartas/h_agee.jpg"},{"tipo":"Héroe","id":"alia","nombre":"Alia «Ghost (of Tsushima)»","clase":"Ciudadana","fuerza":"4 / 2","movimiento":5,"nivel":2,"expansion":4,"texto":"Sigilo: puede atravesar espacios con Zeds sin combatir; cada uno cuesta 2 de Movimiento. Debe acabar en un espacio libre de Zeds e ignora el Caos al moverse. Emboscada (katana): +2 columnas al atacar Cuerpo a Cuerpo a Zeds situados más cerca del Centro que ella en la misma ruta (se compara su posición antes del ataque). Evasión: al entrar un Zed en su espacio, tira 1 dado. Con 4-6 se retira gratis 1 espacio hacia el Centro, si está libre de Zeds, antes de combatir. Parada perfecta: +1 columna al defender Cuerpo a Cuerpo. Una vez por turno repite una tirada defensiva; vale el segundo resultado. Ya no es hora de estar en la calle: Acción de Personaje, 1 vez por fase de Acciones: mueve gratis hasta 2 espacios hacia el Centro a una unidad de Civiles (normales o heroicos) o Refugiados en su espacio o adyacente. A que voy yo y lo encuentro: al Buscar, tira 2 dados y elige el mejor resultado (con dobles naturales busca dos veces, como un Rapiñador).","img":"assets/cartas/h_alia.jpg"},{"tipo":"Héroe","id":"betty","nombre":"Betty «Saltarina» Bolívar","clase":"Ciudadana","fuerza":"3 / 2","movimiento":4,"nivel":1,"expansion":2,"texto":"Miope: no puede disparar. Despiadada: lucha siempre en la columna «Humanos ×3» (cara completa) o «Humanos ×2» (cara reducida), atacando o defendiendo, sin otros modificadores. Los modificadores de cartas especiales, Súper Arma y repetir tiradas sí se aplican. Agrupada con Wilson tira 3 dados. Temeraria: cuando gana un combate contra Zeds, si en el siguiente espacio hacia el Centro hay Zeds, entra y ataca de nuevo (sube la Infección como siempre). Solo la detiene ser eliminada o no haber más Zeds. Ignora Caos y el Puente. Inmortal: en su tirada de Salvación tira 2 dados y elige el mejor.","img":"assets/cartas/h_betty.jpg"},{"tipo":"Héroe","id":"carter","nombre":"Carter «Ruedas Grandes»","clase":"Montado","fuerza":"8 / 4","movimiento":5,"nivel":3,"expansion":1,"texto":"El rey de la carretera: solo rutas de la superficie; no dispara, arresta ni usa otros vehículos; no sube la Infección al combatir. No tiene que parar al conducir por el Caos (pero no empieza un movimiento desde él). Transportista de Cargamento: entra por un Inicial con la ficha en «Cargado». Al llegar al Centro cargado, el movimiento termina: +5 Suministros y +3 Munición, y se da la vuelta a «Vacío». Recarga en un Inicial con 1 Acción. Barrer Zeds: al cruzar un espacio con Zeds (si le quedan puntos): 1 dado, 4-6 inflige 1 Impacto a cada Zed y sigue; si falla se detiene y combate. Reparar: solo sufre Impactos su camión (6 en total). En el Centro o un Inicial retira 1 Impacto por turno (1 Suministro o 1 Acción).","img":"assets/cartas/h_carter.jpg"},{"tipo":"Héroe","id":"darling","nombre":"Alyssa Darling","clase":"Ciudadana","fuerza":"3 / 2","movimiento":5,"nivel":3,"expansion":0,"texto":"Ataque asesino: al entrar con Zeds (o al entrar ellos) tira 1 dado: 1 combate normal; 2 puedes retroceder 1 espacio o luchar; 3-6 ataque con 2 columnas a favor, sin Infección ni daño para ella. Reforzada: ignora Impactos con 5-6. Mueve 5.","img":"assets/cartas/h_darling.jpg"},{"tipo":"Héroe","id":"hauser","nombre":"Otto «Sargento» Hauser","clase":"Militar","fuerza":"3 / 2","movimiento":4,"nivel":4,"expansion":0,"texto":"Entrenar: como una Acción: una unidad de Civiles Normales en su espacio o adyacente recibe +2 de Fuerza (hasta ser eliminada). Reclutar: en el Centro, como una Acción y por 1 Munición retira 1 Impacto a unas Civiles Normales del mapa (no del Hospital). Buscar: +1 a sus tiradas de Buscar. Resistente: ignora Impactos con 4-6.","img":"assets/cartas/h_hauser.jpg"},{"tipo":"Héroe","id":"hernandez","nombre":"Alcalde Hernández","clase":"Ciudadano","fuerza":"2 / 1","movimiento":4,"nivel":1,"expansion":0,"texto":"Llaves de la Ciudad: +1 a las tiradas de Buscar de cualquier unidad en espacios de Ciudad y en el Centro. Control del tráfico: entrar en el Centro cuesta 0 de Movimiento. Ciudadela: Acción de Personaje: una unidad del Centro realiza un disparo gratis (1 Munición) con 1 columna a favor. Discurso Motivador: una vez por partida: cada unidad de jugador en la Ciudad o el Centro recibe 1 Acción gratis.","img":"assets/cartas/h_hernandez.jpg"},{"tipo":"Héroe","id":"horacio","nombre":"Horacio (chimpancé)","clase":"Primate","fuerza":"4 / 3","movimiento":4,"nivel":4,"expansion":0,"texto":"Los frutos del trabajo: al entrar en juego obtienes 3 Suministros. Modificaciones genéticas: nunca sube la Infección al atacar o defender en combate Cuerpo a Cuerpo. Resistente: ignora Impactos con 4-6. Tácticas de gorila: en cada combate Cuerpo a Cuerpo puede repetir la tirada (la segunda es definitiva). El gran simio: no dispara. Resiste 4 Impactos como las Civiles.","img":"assets/cartas/h_horacio.jpg"},{"tipo":"Héroe","id":"hunt","nombre":"Sheriff Hunt","clase":"Policía","fuerza":"5 / 3","movimiento":4,"nivel":1,"expansion":0,"texto":"Liderazgo: Acción de Personaje: da 1 Acción gratis a una unidad de Civiles (normales o heroicos) o Marines en su espacio o adyacente. Largo Alcance: dispara a 2 espacios con 1 columna en contra. Resistente: cada Impacto se ignora con 4-6. Artes marciales: puede repetir la tirada de combate Cuerpo a Cuerpo.","img":"assets/cartas/h_hunt.jpg"},{"tipo":"Héroe","id":"johnson","nombre":"Sr. Johnson","clase":"Rapiñador","fuerza":"3 / 2","movimiento":4,"nivel":1,"expansion":0,"texto":"Al entrar en juego: obtienes 2 Suministros y 3 de Munición. Rapiñador: tira 2 dados al Buscar y elige el mejor (dobles naturales: resultado doble). Armas: sus ataques con Arma de Fuego tienen 2 columnas a favor. Trampas: cuando una unidad Zed entra en su espacio tira 1 dado: 1-3 combate normal; 4-6 el Zed sufre 1 Impacto y Johnson retrocede. Curar: Acción (1 Suministro) para Curar a una unidad en su espacio o adyacente.","img":"assets/cartas/h_johnson.jpg"},{"tipo":"Héroe","id":"jones","nombre":"Alan «Xeno» Jones","clase":"Científico","fuerza":"4 / 3","movimiento":4,"nivel":4,"expansion":0,"texto":"Sus Propios Planes: una Acción de Personaje por fase de Acciones, solo para su unidad. Pistola experimental: sus disparos cuestan 1 Suministro en vez de Munición. En una Oficina del Hospital: con su Acción de Personaje manda 1 unidad del Hospital al Cementerio y revela la siguiente carta de Investigación (no cuenta como Investigar). Puede Investigar en el Laboratorio.","img":"assets/cartas/h_jones.jpg"},{"tipo":"Héroe","id":"kingman","nombre":"Coronel Kingman","clase":"Militar","fuerza":"3 / 2","movimiento":4,"nivel":2,"expansion":0,"texto":"Bastión: una vez por partida, 1 Acción + 3 Suministros: ficha de Bastión (Terreno 3, permanente). Campo de Minas: una vez por partida, 1 Acción + 2 Suministros + 1 Munición. Defensor: 1 columna a favor al defender. Perímetro Defensivo: cuando un Zed se mueve a su espacio o a uno adyacente: tira 1 dado, con 5-6 el movimiento se cancela.","img":"assets/cartas/h_kingman.jpg"},{"tipo":"Héroe","id":"lee","nombre":"General Lee","clase":"Equino","fuerza":"2 / 1","movimiento":6,"nivel":2,"expansion":1,"texto":"Ensillar: puede llevar a un Héroe humano o primate no montado como parte de 1 Acción de Mover (viaje gratis para el jinete). Cuentan como una sola unidad para el agrupamiento. Carga de caballería: cualquier Héroe agrupado con Lee suma 1 de Fuerza y no sube la Infección al combatir. Purasangre: recibe 1 Acción de Mover gratis por fase de Acciones. Instinto equino: cuando no transporta a un jinete, no puede entrar voluntariamente en un espacio con Caos ni en la ruta del Túnel. Puede llevar a un herido al Hospital («Galope al Hospital»). Un caballo es un caballo: no sube la Infección, no dispara, construye, usa vehículos, restaura ni arresta. Puede elegir retirarse antes de ser atacado.","img":"assets/cartas/h_lee.jpg"},{"tipo":"Héroe","id":"may","nombre":"Sra. May Hauser","clase":"Ciudadana","fuerza":"3 / 1","movimiento":4,"nivel":1,"expansion":1,"texto":"Intendente ahorradora: si está en un espacio de Ciudad, por cada Munición que pierdas o gastes tiras 1 dado: con 5-6 no la pierdes. La voluntaria de hierro: en una Oficina del Hospital, las unidades dadas de alta en la fase de Acciones obtienen 1 Acción gratis. Entrenadora de combate: cada unidad de jugador agrupada con ella (incluso en el Centro) recibe +1 de Fuerza en combate Cuerpo a Cuerpo. Pistolera de primera: 1 columna a favor al disparar y tira 1 dado extra (eliges los 2 mejores). Su primer disparo del turno no gasta Munición.","img":"assets/cartas/h_may.jpg"},{"tipo":"Héroe","id":"pepinillos","nombre":"Pepinillos (pastor alemán)","clase":"Rapiñador","fuerza":"2 / 1","movimiento":6,"nivel":2,"expansion":0,"texto":"Rápido: mueve 6 espacios y no lo detiene el Caos. Rapiñador: tira 2 dados al Buscar (solo 1 en espacios controlados por Zeds, donde sí puede buscar). Sigilo: al coincidir con Zeds o Saqueadores tira 1 dado: 1 combate Cuerpo a Cuerpo; 2-6 sigiloso, las unidades coexisten sin efecto. Ladrido ruidoso: cuando un Zed o Saqueador intenta salir de su espacio: 4-6 cancela el movimiento. Perruno: no dispara, construye, usa vehículos, restaura el orden ni arresta; el Caos no lo detiene.","img":"assets/cartas/h_pepinillos.jpg"},{"tipo":"Héroe","id":"piazza","nombre":"Capitana Piazza","clase":"Militar","fuerza":"3 / 2","movimiento":5,"nivel":1,"expansion":0,"texto":"Francotiradora de élite: disparos de Largo Alcance hasta 3 espacios (no a través del Centro). Fuerza 2 a 1 espacio, 4 a 2 espacios, 3 a 3 espacios. Vigilancia: tras disparar puede retroceder 1 espacio (con las unidades que quiera de su espacio). Fabricar Munición: gasta 2 Acciones para disparar sin gastar Munición.","img":"assets/cartas/h_piazza.jpg"},{"tipo":"Héroe","id":"porter","nombre":"Antonio «Porter» Maestre","clase":"Ciudadano","fuerza":"5 / 3","movimiento":4,"nivel":1,"expansion":4,"texto":"Artes marciales: +1 columna a favor al defender Cuerpo a Cuerpo. Puede repetir cualquier tirada Cuerpo a Cuerpo (la segunda es definitiva). En zapatillas no se puede pasar: si un Zed intenta entrar en su espacio o en uno adyacente, con 4-6 se cancela su movimiento. Máximo 1 por fase de los Zeds; los fallos no cuentan. Antes del combate. Jefe de equipo: Acción de Personaje, 1 vez por fase de Acciones: 1 Acción gratis a una unidad de Civiles (normales o heroicos) en su espacio o adyacente. Resistente: ignora Impactos con 5-6.","img":"assets/cartas/h_porter.jpg"},{"tipo":"Héroe","id":"santana","nombre":"Miguel «El Toro Loco» Santana","clase":"Luchador","fuerza":"6 / 4","movimiento":3,"nivel":2,"expansion":0,"texto":"Carga del Toro: al atacar Cuerpo a Cuerpo a Zeds normales: 1-3 combate normal; 4-6 el Zed sufre 1 Impacto y se retira sin combate (sin Infección). No tiene efecto contra Súper Zeds. Completo: resiste 4 Impactos antes de ser eliminado (como los Civiles). Tirador mediocre: sus ataques con Arma de Fuego se hacen con la mitad de su Fuerza (3/2).","img":"assets/cartas/h_santana.jpg"},{"tipo":"Héroe","id":"schmidt","nombre":"Ayudante Schmidt","clase":"Policía","fuerza":"4 / 2","movimiento":4,"nivel":1,"expansion":0,"texto":"Iniciativa: una Acción de Personaje por fase de Acciones, solo para su unidad. Boy Scout de rango Águila: 1 columna a favor en combates Cuerpo a Cuerpo. Resistente: cada Impacto se ignora con 4-6. Artes marciales: en cada combate Cuerpo a Cuerpo puede repetir la tirada (la segunda es definitiva).","img":"assets/cartas/h_schmidt.jpg"},{"tipo":"Héroe","id":"seaver","nombre":"Doc Seaver","clase":"Científico","fuerza":"3 / 1","movimiento":4,"nivel":3,"expansion":0,"texto":"Científico: puede entrar en las Oficinas del Hospital y en el Laboratorio (donde puede Investigar). Médico: una vez por fase de Acciones, en una Oficina, cura (Acción de Personaje) a cualquier unidad del Hospital. Primeros Auxilios (1 Suministro): una vez por fase cura a una unidad en su espacio o adyacente (incluso a sí mismo). Estando en una Oficina o en el Centro puede curar a una unidad del Hospital. Administración del Hospital: en una Oficina admite un cuarto paciente, que puede quedarse aunque se vaya.","img":"assets/cartas/h_seaver.jpg"},{"tipo":"Héroe","id":"staub","nombre":"Rusty Staub","clase":"Ciudadano","fuerza":"4 / 5","movimiento":4,"nivel":2,"expansion":0,"texto":"Buscar: obtienes 1 Suministro extra al Buscar con él. Primer disparo gratis: su primer disparo del turno no gasta Munición. Suertudo: en su tirada de Salvación tira 2 dados y elige el mejor. Reforzado. Feroz: herido, su Fuerza Cuerpo a Cuerpo sube a 5 y la de sus disparos baja a 2.","img":"assets/cartas/h_staub.jpg"},{"tipo":"Héroe","id":"wilson","nombre":"Wilson el Ermitaño","clase":"Rapiñador","fuerza":"2 / 1","movimiento":4,"nivel":4,"expansion":0,"texto":"Rapiñador: tira 2 dados al Buscar. Visiones: puedes mirar la carta superior del mazo de Destino en cualquier momento. Compañero: la unidad agrupada con él tira 1 dado extra y elige los mejores (no en el Centro).","img":"assets/cartas/h_wilson.jpg"},{"tipo":"Héroe","id":"wright","nombre":"Agente Especial Wright","clase":"Científica","fuerza":"4 / 2","movimiento":4,"nivel":3,"expansion":0,"texto":"Equipo de apoyo: 1 columna a favor en combates y disparos. Información clasificada: 1 Acción: mira la carta superior del mazo de Eventos. En las Oficinas del Hospital: +1 a las tiradas de Salvación de las unidades de jugador. Reforzada: ignora Impactos con 5-6.","img":"assets/cartas/h_wright.jpg"},{"tipo":"Civiles Heroicos","id":"antidist","nombre":"F.D.P.D. Antidisturbios","clase":"Civiles Heroicos","fuerza":"5 / 3","movimiento":3,"nivel":2,"expansion":0,"texto":"Nunca suben la Infección al combatir ni al restaurar el orden. No disparan.","img":"assets/cartas/h_antidist.jpg"},{"tipo":"Civiles Heroicos","id":"bauer","nombre":"Cuadrilla de Bob Bauer","clase":"Civiles Heroicos","fuerza":"3 / 2","movimiento":3,"nivel":2,"expansion":0,"texto":"Dispositivos explosivos: Acción de Personaje: convierte 2 Suministros en 1 Munición. Construye Barricadas por 1 Suministro.","img":"assets/cartas/h_bauer.jpg"},{"tipo":"Civiles Heroicos","id":"bomberos","nombre":"Voluntarios de Bomberos 129","clase":"Civiles Heroicos","fuerza":"3 / 2","movimiento":3,"nivel":2,"expansion":0,"texto":"1 columna a favor en todos los combates Cuerpo a Cuerpo. Autoridad Civil: Acción de Personaje: libera Civiles Resistiendo o convierte Aldeanos en Refugiados (en o adyacente a un Pueblo). Mangueras: tira 2 dados; si el total ≥ a la Fuerza de un Zed adyacente, se retira.","img":"assets/cartas/h_bomberos.jpg"},{"tipo":"Civiles Heroicos","id":"clarin","nombre":"Mensajero del Clarín","clase":"Civiles Heroicos","fuerza":"1 / 1","movimiento":3,"nivel":3,"expansion":0,"texto":"Al entrar en juego trae otras Civiles Heroicos. Mientras esté en juego un Zed que llega al Centro no gana automáticamente: tiene que ganar un combate. El segundo Suministro gastado cada fase es gratis.","img":"assets/cartas/h_clarin.jpg"},{"tipo":"Civiles Heroicos","id":"division12","nombre":"12.ª División de Veteranos","clase":"Civiles Heroicos","fuerza":"3 / 2","movimiento":3,"nivel":1,"expansion":0,"texto":"Su primer disparo del turno no gasta Munición. Gana todo combate Cuerpo a Cuerpo contra Zeds (los Zeds se retiran, sin importar la tirada).","img":"assets/cartas/h_division12.jpg"},{"tipo":"Civiles Heroicos","id":"furias","nombre":"Furias de Farmingdale","clase":"Civiles Heroicos","fuerza":"6 / 3","movimiento":4,"nivel":1,"expansion":0,"texto":"Luchadoras: no pueden disparar con Arma de Fuego. Resistentes: ignoran Impactos con 4-6. Mueven 4.","img":"assets/cartas/h_furias.jpg"},{"tipo":"Civiles Heroicos","id":"jaque","nombre":"Jaque Mates™","clase":"Civiles Heroicos","fuerza":"1 / 1","movimiento":3,"nivel":2,"expansion":1,"texto":"Estrategas: al comienzo de cada fase de Acciones tira 1 dado: si es mayor que tus Acciones de Evento, obtienes 1 Acción de Evento más (incluso por encima de 4). Ruse de jeu: por cada Refugiados en el Campo de Refugiados su Fuerza aumenta +1 (cara completa) y +½ (cara reducida, redondeando abajo).","img":"assets/cartas/h_jaque.jpg"},{"tipo":"Civiles Heroicos","id":"salvacion","nombre":"Tropas de Salvación","clase":"Civiles Heroicos","fuerza":"2 / 1","movimiento":3,"nivel":1,"expansion":0,"texto":"Al entrar en juego: 2 Suministros. Campamento Médico: Acción de Personaje (1 Suministro): cura a una unidad en su espacio o adyacente. +1 a la tirada de Alimentación.","img":"assets/cartas/h_salvacion.jpg"},{"tipo":"Civiles Heroicos","id":"wzed","nombre":"WZED Farmingdale","clase":"Civiles Heroicos","fuerza":"1 / 1","movimiento":3,"nivel":3,"expansion":0,"texto":"Transmisión de Emergencia: Acción de Personaje: 1 Acción gratis a una Civil Normal o Refugiados en la superficie. Al defender en la Ciudad o el Centro tiras 1 dado extra y eliges los mejores.","img":"assets/cartas/h_wzed.jpg"},{"tipo":"Unidad especial","id":"aldeanos","nombre":"Aldeanos","fuerza":"1 / 1","movimiento":1,"texto":"Inmóviles. No cuentan para el límite de agrupamiento. Cuando los Zeds ocupan su Pueblo se convierten en Refugiados y huyen 1 espacio.","img":null},{"tipo":"Unidad especial","id":"bubba","nombre":"Banda de Bubba","fuerza":"6 / 3","movimiento":1,"texto":"Como los Saqueadores, con 1 columna a favor contra Zeds y 1 en contra contra jugadores. Si llegan al Centro infligen 1 Impacto a cada unidad en la Ciudad.","img":null},{"tipo":"Unidad especial","id":"diamante","nombre":"Guardia de Seguridad Diamante Rojo","fuerza":"4 / 3","movimiento":3,"texto":"Patrulla del Túnel: mueven 3 espacios por Acción de Mover. Entran en juego en el nivel IV, colocados en la ruta del Túnel; una empieza en la Garita de Seguridad. Acceso Diamante Rojo: no se pierden ni tiran en la tabla de Cripta al salir de espacios de Cripta; se mueven con normalidad por la superficie.","img":null},{"tipo":"Unidad especial","id":"guardia","nombre":"Guardia Nacional","fuerza":"10 / 6","movimiento":1,"texto":"Soporta 6 Impactos. Mueve 1 espacio en 4R y 1 por Acción de Mover (solo superficie). Cada disparo cuesta 2 Munición. No puede usar la Súper Arma hasta llegar a un espacio de Ciudad o al Centro de la Ciudad (después la conserva).","img":"assets/cartas/u_guardia.jpg"},{"tipo":"Unidad especial","id":"marines","nombre":"Marines","fuerza":"5 / 3","movimiento":3,"texto":"Civiles Especiales Militares. 1 columna a favor al combatir. Disparos de Largo Alcance (con 1 en contra). Mueven 1 espacio gratis en la fase 4R. Traen 4 de Munición.","img":"assets/cartas/u_marines.jpg"},{"tipo":"Unidad especial","id":"petra","nombre":"Ángeles de Petra","fuerza":"4 / 3","movimiento":4,"texto":"Motos: mueven 4 espacios por Acción de Mover, solo en la superficie (nunca entran en la ruta del Túnel). Combustible: sus Ataques con Arma de Fuego consumen 1 Suministro en lugar de 1 de Munición. Aislamiento: no pueden agruparse con Héroes ni Civiles fuera del Centro de la Ciudad (sí con Refugiados o No-Zeds). Retirada en Carretera: al retirarse, retroceden hacia el Centro hasta el primer espacio libre de Héroes o Civiles. Ninguna otra unidad de jugador puede detenerse en su espacio al retirarse.","img":null},{"tipo":"Unidad especial","id":"refugiados","nombre":"Refugiados","fuerza":"1 / 1","movimiento":1,"texto":"Solo pueden moverse (1 espacio por Acción de Mover). No luchan ni se retiran. Los Zeds que los alcancen sin defensores los devoran (+2 Infección).","img":null},{"tipo":"Unidad especial","id":"saqueadores","nombre":"Saqueadores","fuerza":"6 / 3","movimiento":1,"texto":"Se mueven 1 espacio por turno hacia el Centro en la fase 4R. Luchan contra todo salvo Refugiados/Aldeanos. Si llegan al Centro pierdes Suministros y Munición igual a su Fuerza.","img":null},{"tipo":"Unidad especial","id":"vip","nombre":"Supervivientes V.I.P.","fuerza":"1 / 1","movimiento":1,"texto":"Se comportan como Refugiados. Al llegar al Centro eliges un beneficio especial.","img":null},{"tipo":"Súper Zed","id":"berserker","nombre":"Berserkers","fuerza":"7 / 4","texto":"Si atacan y ganan, avanzan de inmediato otro espacio (se repite), separándose de la Horda.","img":"assets/tokens/sz_berserker.png"},{"tipo":"Súper Zed","id":"condenado","nombre":"Condenados","fuerza":"7 / 5","texto":"Quien combate contra ellos pierde automáticamente y se retira (los Impactos se aplican igualmente).","img":"assets/tokens/sz_condenado.png"},{"tipo":"Súper Zed","id":"devastador","nombre":"Devastadores","fuerza":"1 / 8","texto":"Fuerza 1 intactos… pero al ser heridos pasan a Fuerza 8.","img":"assets/tokens/sz_devastador.png"},{"tipo":"Súper Zed","id":"ferreo","nombre":"Férreos","fuerza":"10 / 5","texto":"Resistentes: cada Impacto se cancela con 1-3 en un dado.","img":"assets/tokens/sz_ferreo.png"},{"tipo":"Súper Zed","id":"gigante","nombre":"Gigantes","fuerza":"12 / 6","texto":"Sin habilidades especiales: simplemente enormes.","img":"assets/tokens/sz_gigante.png"},{"tipo":"Súper Zed","id":"lobo","nombre":"Zeds-Lobo","fuerza":"5 / 3","texto":"Combatir contra ellos sube la Infección +2 (en vez de +1). T
